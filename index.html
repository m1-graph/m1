  .wrap{ max-width:1080px; margin:0 auto; padding:18px 16px 40px; }
  a{ color:var(--red); }
  button{ min-height:2.25rem; }

  .group-label{ font-size:13px; font-weight:900; margin:14px 0 7px; display:flex; align-items:center; gap:8px; }
  .group-label::before{ content:""; width:7px; height:16px; background:var(--red); border-radius:2px; flex:none; }
  .group-label .win{ font-size:12px; font-weight:700; color:var(--gold); }
  .group-label:first-of-type{ margin-top:0; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{ display:inline-flex; align-items:center; gap:7px; padding:5px 11px 5px 9px; min-height:38px; border:1.5px solid var(--line); border-radius:999px; background:#fff; color:var(--ink); font:inherit; font-size:13.5px; font-weight:700; cursor:pointer; }
  .chip .dot{ width:11px; height:11px; border-radius:50%; background:var(--c); flex:none; }
  .chip[aria-pressed="true"]{ border-color:var(--c); background:color-mix(in srgb, var(--c) 10%, #fff); }
  .chip[aria-pressed="false"]{ opacity:.5; }
  .chart-box{ position:sticky; top:8px; z-index:30; max-width:600px; margin:0 auto 6px; padding:12px 10px 8px; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 6px 20px rgba(23,21,15,.08); }
  .rangebar{ display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:0 0 10px; }
  .rangebar .rl{ font-size:12.5px; font-weight:900; color:var(--muted); }
  .rbtn{ padding:5px 13px; min-height:36px; border:1.5px solid var(--line); border-radius:999px; background:#fff; color:var(--ink); font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .rbtn[aria-pressed="true"]{ border-color:var(--red); background:#fdf0f2; color:var(--red); }
  .range-sep{ width:1px; height:24px; background:var(--line); margin:0 4px; flex:none; }
  svg text{ font-family:"Noto Sans JP",sans-serif; }
  footer{ margin-top:34px; border-top:1px solid var(--line); padding-top:10px; color:var(--muted); font-size:12px; }

const YEARS_MODERN = [2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025];
const YEARS_ALL = [2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,...YEARS_MODERN];
let YEARS = [...YEARS_MODERN], extended = false;
const DEFAULTS = ["takuro","reiwa","shinku","evers"];
let selected = Object.fromEntries(DEFAULTS.map(id => [id, true]));
let focusId = DEFAULTS[0];
const chartEl = document.getElementById("chart");
const byId = id => COMBI.find(c => c.id === id);

/* グラフ寸法：2001〜表示でも縦の長さと文字サイズが変わらないよう全体を同じ比率で拡大 */
const BASE_W = 980, BASE_H = 520;
let H, ML, MR, MT, MB, plotH;
const curW = () => extended ? 1440 : BASE_W;
const S = () => curW() / BASE_W;
const plotW = () => curW() - ML - MR;
function syncDims(){ const s = S(); H = BASE_H*s; ML = 96*s; MR = 14*s; MT = 24*s; MB = 44*s; plotH = H - MT - MB; }
const X = yr => ML + (YEARS.indexOf(yr) + .5) * (plotW() / YEARS.length);
const Y = lv => MT + (8 - lv) / 7 * plotH;

/* 年ごとの見出し＋チップを生成（2010年以前の組も常時表示） */
const groupsEl = document.getElementById("groups");
for (const [yr, win, ids] of GROUPS) {
  const lab = document.createElement("div");
  lab.className = "group-label";
  lab.innerHTML = yr + ' 決勝 <span class="win">優勝：' + win + "</span>";
  const box = document.createElement("div");
  box.className = "chips"; box.setAttribute("role","group"); box.setAttribute("aria-label", yr + "年決勝 コンビの選択");
  for (const id of ids) {
    const c = byId(id); if (!c) continue;
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.id = c.id;
    b.style.setProperty("--c", c.color);
    b.setAttribute("aria-pressed", selected[c.id] ? "true" : "false");
    b.innerHTML = '<span class="dot"></span>' + c.name;
    b.addEventListener("click", () => {
      const on = !selected[c.id];
      if (on) selected[c.id] = true; else delete selected[c.id];
      if (on) focusId = c.id;
      else if (focusId === c.id) { const n = COMBI.find(k => selected[k.id]); focusId = n ? n.id : null; }
      syncChips(); render();
    });
    box.appendChild(b);
  }
  groupsEl.append(lab, box);
}
function syncChips(){ document.querySelectorAll(".chip").forEach(n => n.setAttribute("aria-pressed", selected[n.dataset.id] ? "true" : "false")); }

const btnModern = document.getElementById("btnModern"), btnAll = document.getElementById("btnAll");
function setRange(all){
  extended = all; YEARS = [...(all ? YEARS_ALL : YEARS_MODERN)];
  btnModern.setAttribute("aria-pressed", String(!all));
  btnAll.setAttribute("aria-pressed", String(all));
  render();
}
btnModern.addEventListener("click", () => setRange(false));
btnAll.addEventListener("click", () => setRange(true));
document.getElementById("btnReset").addEventListener("click", () => { selected = {}; focusId = null; syncChips(); render(); });

function render(){
  syncDims();
  const s = S(), W = curW(), PW = plotW(), stepH = plotH / 7, colW = PW / YEARS.length;
  const svg = ['<svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="presentation" aria-hidden="true">'];
  /* 背景の帯はグリッド線にぴったり合わせ、線からはみ出さない */
  const bx1 = X(YEARS[0]), bx2 = X(YEARS[YEARS.length-1]);
  svg.push('<rect x="'+bx1+'" y="'+Y(6)+'" width="'+(bx2-bx1)+'" height="'+(Y(5)-Y(6))+'" fill="var(--gold-bg)"/>');
  svg.push('<rect x="'+bx1+'" y="'+Y(8)+'" width="'+(bx2-bx1)+'" height="'+(Y(6)-Y(8))+'" fill="var(--final-bg)"/>');
  /* グリッドは点の座標に線を通す。存在しなかったラウンド（2001〜2009準々決勝／2020年3回戦）は
     その範囲の十字線を抜き、隣のグリッド線を外周とする「口」にする */
  const noRound = (yr, lv) => (lv === 4 && yr >= 2001 && yr <= 2009) || (lv === 3 && yr === 2020);
  const grid = [];
  const hSeg = (x1,x2,y) => grid.push('<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'"/>');
  const vSeg = (x,y1,y2) => grid.push('<line x1="'+x+'" y1="'+y1+'" x2="'+x+'" y2="'+y2+'"/>');
  const hOmit = (cx, lv) => YEARS.some(yr => noRound(yr, lv) && cx > X(yr)-colW && cx < X(yr)+colW);
  const vOmit = (yr, cy) => { for (let lv=1; lv<=8; lv++) if (noRound(yr, lv) && cy > Y(lv)-stepH && cy < Y(lv)+stepH) return true; return false; };
  YEARS.forEach((yr, i) => {
    const x1 = ML + i*colW, xc = X(yr), x2 = x1 + colW;
    for (let lv=1; lv<=8; lv++) {
      if (!hOmit((x1+xc)/2, lv)) hSeg(x1, xc, Y(lv));
      if (!hOmit((xc+x2)/2, lv)) hSeg(xc, x2, Y(lv));
    }
  });
  for (let lv=1; lv<=8; lv++) {
    const top = lv === 8 ? MT : Y(lv) - stepH/2, bot = lv === 1 ? MT + plotH : Y(lv) + stepH/2, ym = Y(lv);
    for (const yr of YEARS) {
      if (top < ym && !vOmit(yr, (top+ym)/2)) vSeg(X(yr), top, ym);
      if (ym < bot && !vOmit(yr, (ym+bot)/2)) vSeg(X(yr), ym, bot);
    }
  }
  svg.push('<g stroke="var(--chart-grid)" stroke-width="'+(1.1*s)+'">' + grid.join("") + "</g>");
  svg.push('<rect x="0" y="0" width="'+(ML-4*s)+'" height="'+H+'" fill="#fff"/>');
  if (extended) {
    const bx = (X(2010)+X(2015))/2, cy = MT + plotH/2;
    svg.push('<line x1="'+bx+'" y1="'+MT+'" x2="'+bx+'" y2="'+(MT+plotH)+'" stroke="#b9b2a0" stroke-width="'+(1.4*s)+'" stroke-dasharray="'+(5*s)+" "+(4*s)+'"/>');
    svg.push('<text transform="rotate(-90 '+bx+" "+cy+')" x="'+bx+'" y="'+(cy+4*s)+'" text-anchor="middle" font-size="'+(12*s)+'" font-weight="700" fill="#7a7260" style="paint-order:stroke;stroke:#fff;stroke-width:'+(3*s)+'px;stroke-linejoin:round">2011〜2014 休止</text>');
  }
  for (let lv=1; lv<=8; lv++) {
    const bold = lv >= 6;
    svg.push('<text x="'+(ML-10*s)+'" y="'+(Y(lv)+(bold?7:6.5)*s)+'" text-anchor="end" font-size="'+((bold?19:17.5)*s)+'" font-weight="'+(bold?900:600)+'" fill="'+(lv===8?"var(--gold)":lv>=6?"var(--red)":"var(--muted)")+'">'+LEVELS[lv]+"</text>");
  }
  for (const yr of YEARS) svg.push('<text x="'+X(yr)+'" y="'+(H-12*s)+'" text-anchor="middle" font-size="'+(15*s)+'" font-weight="900" fill="var(--muted)">'+yr+"</text>");
  /* 折れ線（データのない年で切り、2010→2015は休止をまたいでつなぐ） */
  const labels = [];
  for (const c of COMBI) {
    if (!selected[c.id]) continue;
    const foc = c.id === focusId;
    let seg = [];
    const flush = () => {
      if (seg.length > 1) svg.push('<path d="'+seg.map((p,i)=>(i?"L":"M")+p[0]+","+p[1]).join(" ")+'" fill="none" stroke="'+c.color+'" stroke-width="'+((foc?4:2.6)*s)+'" stroke-linejoin="round" stroke-linecap="round" opacity="'+(foc?1:.8)+'"/>');
      seg = [];
    };
    for (const yr of YEARS) {
      if (c.history[yr] === undefined) { flush(); continue; }
      seg.push([X(yr), Y(c.history[yr])]);
    }
    flush();
    let ly = null;
    for (const yr of YEARS) {
      if (c.history[yr] === undefined) continue;
      ly = yr;
      svg.push('<circle cx="'+X(yr)+'" cy="'+Y(c.history[yr])+'" r="'+((foc?7:5.5)*s)+'" fill="'+c.color+'" stroke="#fff" stroke-width="'+(2*s)+'"/>');
      svg.push('<circle class="hit" data-cid="'+c.id+'" data-year="'+yr+'" cx="'+X(yr)+'" cy="'+Y(c.history[yr])+'" r="'+(20*s)+'" fill="transparent" style="cursor:pointer"/>');
    }
    if (ly !== null) labels.push({ name:c.name, color:c.color, foc, x:X(ly), y:Y(c.history[ly]) });
  }
  /* 名前ラベル：最上段は点の下へ、重なりは縦にずらし、左右端ではみ出す分だけ内側へ寄せる */
  for (const it of labels) { it.ly = it.y - 16*s; if (it.ly < 18*s) it.ly = it.y + 29*s; }
  labels.sort((a,b) => a.ly - b.ly || a.x - b.x);
  for (let p=0; p<3; p++) for (let i=1; i<labels.length; i++) for (let j=0; j<i; j++)
    if (Math.abs(labels[i].x-labels[j].x) < 110*s && Math.abs(labels[i].ly-labels[j].ly) < 17*s) labels[i].ly = labels[j].ly + 17*s;
  for (const it of labels) {
    const ly = Math.min(Math.max(it.ly, 14*s), MT + plotH - 2*s);
    const fs = (it.foc ? 15.5 : 14.5) * s;
    let est = 0; for (const ch of it.name) est += ch.charCodeAt(0) > 0xff ? fs : fs*.62;
    const half = est/2 + 4*s;
    const lx = Math.min(Math.max(it.x, half + 2*s), W - 2*s - half);
    svg.push('<text x="'+lx+'" y="'+ly+'" text-anchor="middle" font-size="'+fs+'" font-weight="900" fill="'+it.color+'" style="paint-order:stroke;stroke:#fff;stroke-width:'+(4*s)+'px;stroke-linejoin:round">'+it.name+"</text>");
  }
  svg.push("</svg>");
  chartEl.innerHTML = svg.join("");
  chartEl.querySelectorAll(".hit").forEach(h => h.addEventListener("click", () => {
    const c = byId(h.dataset.cid);
    if (c && c.history[h.dataset.year] !== undefined) { focusId = c.id; render(); }
  }));
}
render();
</script>
</body>
</html>
